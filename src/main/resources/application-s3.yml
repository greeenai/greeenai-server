spring:
  config:
    activate:
      on-profile: "s3"
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME:test-bucket}
    region:
      static: ${S3_REGION:ap-northeast-2}
    credentials:
      accessKey: ${S3_ACCESS_KEY:access-key}
      secretKey: ${S3_SECRET_KEY:secret-key}
    cloudfront:
      domain: ${S3_CLOUDFRONT_DOMAIN}
  stack:
    auto: false
